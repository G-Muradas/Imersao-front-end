<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify | Imersão</title>
    
    <link rel="stylesheet" href="src/styles/reset.css">
    <link rel="stylesheet" href="src/styles/vars.css">
    <link rel="stylesheet" href="src/styles/aside.css">
    <link rel="stylesheet" href="src/styles/footer.css">
    <link rel="stylesheet" href="src/styles/header.css">
    <link rel="stylesheet" href="src/styles/main.css">

    <script src="https://kit.fontawesome.com/38452dc7e7.js" crossorigin="anonymous"></script>
</head>

<body>
    <aside class="sidebar">
        <nav class="sidebar__navigation">
            <div class="logo">
                <a href="">
                    <img src="src/assets/icons/logo-spotify.png" alt="Logo Spotify">                 
                </a>
            </div>
            <ul>
                <li>
                    <a href="">
                        <div><span class="fa-solid fa-home"></span>
                        <span>Início</span></div>
                    </a>
                </li>
                <li>
                    <a href="">
                        <div><span class="fa-solid fa-search"></span>
                        <span>Buscar</span></div>
                    </a>
                </li>
            </ul>
        </nav>
        <div class="library">
            <div class="library__head">
                <button class="library__head__button">
                    <span class="fa-solid fa-book"></span>
                    <span>Sua Biblioteca</span>
                </button>
                <span class="fa-solid fa-plus"></span> 
            </div>
            <section class="playlist">
                <span class="text title">Crie sua primeira playlist.</span>
                <span class="text subtitle">É fácil, vamos te ajudar!</span>
                <button class="playlist__button">
                    <span>Criar playlist</span>
                </button>
            </section>
            <div class="cookies">
                <a href="">Política de cookies</a>
            </div>
            <div class="languages">
                <button class="languages__button">
                    <div>
                        <span class="fa-solid fa-globe"></span>
                        <span>Português do Brasil</span>
                    </div>
                </button>
            </div>
        </div>
    </aside>

    <header>
        <div class="header-container">
            <nav class="header__navigation">
                <div class="navigation__buttons">
                    <button class="arrow-left">
                        <img src="src/assets/icons/small-left.png" alt="Seta para esquerda">
                    </button>
                    <button class="arrow-right">
                        <img src="src/assets/icons/small-right.png" alt="Seta para direita">
                    </button>
                </div>
                <div class="header__search">
                    <img src="src/assets/icons/search.png" alt="">
                    <input id="search-input" type="text" maxlength="800" placeholder="O que você quer ouvir?"/>
                </div>
                <div class="header__login">
                    <button class="subscribe">Inscreva-se</button>
                    <button class="login">Entrar</button>
                </div>
            </nav>
        </div>
    </header>

    <main>    
        <div class="main-container">
            <div class="container__text">
                <h1 class="container__title">Olá, seja bem-vindo!</h1>
                <h2 class="container__subtitle">Navegue por todas as seções</h2>
            </div>
            <div class="container__sections">

            </div>

        </div>
    </main>

    <footer>
        <div class="footer__content">
            <div class="footer__content__text">
                <span class="footer-title">TESTAR O PREMIUM DE GRAÇA</span>
                <span class="footer-subtitle">Inscreva-se para curtir músicas ilimitadas e podcasts só com alguns anúncios. Não precisa de cartão de crédito.</span>
            </div>
            <div class="footer__content__button">
                <button>Inscreva-se agora</button>
            </div>
        </div>
    </footer> 
</body>
</html>
